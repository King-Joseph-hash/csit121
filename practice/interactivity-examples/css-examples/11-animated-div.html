<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animated div</title>
    <style>
        /* https://www.w3schools.com/css/css3_animations.asp */
        body {
           margin: 100px;
        }
        #animated {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            width: 50px;
            background: #92B901;
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            padding: 10px;
            position: relative;
            border-radius: 5px;
            animation: animated_div 5s 5;
            /* above is shorthand for
            animation-name: animated_div;
            animation-duration: 5s;
            animation-timing-function: ease; -- default value 
            animation-delay: 0s;             -- default value
            animation-iteration-count: 5;
            animation-direction: normal;     -- default value
            animation-fill-mode: none;       -- default value
            animation-play-state: running;   -- default value
            */
        }

        @keyframes animated_div {
            0% {
                transform: rotate(0deg);
                left: 0px;
            }

            25% {
                transform: rotate(20deg);
                left: 0px;
            }

            50% {
                transform: rotate(0deg);
                left: 500px;
            }

            55% {
                transform: rotate(0deg);
                left: 500px;
            }

            70% {
                transform: rotate(0deg);
                left: 500px;
                background: #1ec7e6;
            }

            100% {
                transform: rotate(-360deg);
                left: 0px;
            }
        }
    </style>
</head>

<body>
    <div id="animated">CSS</div>
</body>

</html>
