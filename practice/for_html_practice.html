<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Nested Flex</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Verdana, sans-serif;
        }

        #wrapper {
            background-color: #EAEAEA;
            min-height: 100vh;
        }

        header,
        footer {
            background-color: #498fbe;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: lightgray;
            padding: 20px;
        }

        main {
            background-color: white;
            padding: 20px;
        }

        #content {
            display: flex;
        }

        nav {
            width: 200px;
            flex-shrink: 0;
        }

        main {
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <header>Header</header>
        <div id="content">
            <nav>Nav</nav>
            <main>Main content</main>
        </div>
        <footer>Footer</footer>
    </div>
</body>

</html>
