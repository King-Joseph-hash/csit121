<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example: Dark Mode Toggle</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1f1f1f;
    }

    h1 {
      color: #0a4054;
    }

    code {
      background: #eee;
      padding: 2px 5px;
    }

    #theme-btn {
      border: 2px solid currentColor;
      background: transparent;
      color: inherit;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    body {
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body.dark {
      background-color: #0a4054;
      color: #ffffff;
    }

    body.dark h1 {
      color: #f9c996;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <h1>Example: Dark Mode Toggle</h1>
  <p>Click the button to switch between light and dark.</p>

  <button id="theme-btn">Toggle dark mode</button>

  <script>
    // FIND the button
    const themeBtn = document.getElementById('theme-btn');

    // LISTEN for a click, then CHANGE: add or remove the "dark" class on <body>
    themeBtn.addEventListener('click', function () {
      document.body.classList.toggle('dark');
    });
  </script>
</body>

</html>
