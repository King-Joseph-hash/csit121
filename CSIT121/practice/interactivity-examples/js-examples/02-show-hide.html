<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example: Show and Hide</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1f1f1f;
    }

    h1 {
      color: #0a4054;
    }

    code {
      background: #eee;
      padding: 2px 5px;
    }

    #menu-btn {
      background: #0a4054;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    #menu {
      background: #daeceb;
      padding: 10px 20px;
      margin-top: 10px;
    }


    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <h1>Example: Show and Hide</h1>
  <p>Click the button to show or hide the menu.</p>

  <button id="menu-btn">Menu</button>
  <nav id="menu" class="hidden">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>


  <script>
    // FIND both elements by id
    const menu = document.getElementById('menu');
    const btn = document.getElementById('menu-btn');

    // LISTEN for a click, then CHANGE: add or remove the "hidden" class
    btn.addEventListener('click', function () {
      menu.classList.toggle('hidden');
    });
  </script>

</body>

</html>
