<!DOCTYPE html>
<html lang="en">

<head>
  <title>JavaScript Practice</title>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1f1f1f;
    }

    h1 {
      color: #0a4054;
    }

    code {
      background: #eee;
      padding: 2px 5px;
    }

    button {
      background: #0a4054;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Using JavaScript</h1>
  <script>
    var userName;
    userName = prompt("Please enter your name");
    document.write("<h2>Hello " + userName + "</h2>");
  </script>
</body>

</html>
