<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example: alert()</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1f1f1f;
    }

    h1 {
      color: #0a4054;
    }

    code {
      background: #eee;
      padding: 2px 5px;
    }

    button {
      background: #0a4054;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Example: alert()</h1>
  <p>Click the button. A pop-up message appears.</p>


  <button id="greet">Say hello</button>


  <p>Try this: change <code>id="greet"</code> to <code>id="Greet"</code>, save, and reload. Why does it stop working?
  </p>

  <!-- SCRIPT START right before </body> -->
  <script>
    // 1. FIND the button by its id
    const btn = document.getElementById('greet');

    // 2. LISTEN for a click, 3. CHANGE: show a message
    btn.addEventListener('click', function () {
      alert('Hello from JavaScript!');   // edit the message here
    });
  </script>
  <!-- END SCRIPT -->
</body>

</html>
