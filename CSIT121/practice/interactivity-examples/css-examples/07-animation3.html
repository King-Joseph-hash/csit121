<!DOCTYPE html>
<html>
<head>
<style>
body {
    background-color: rgb(241, 253, 231);
}
main {
    background-color: rgb(255, 229, 198);
    width: 50vw;
    height: 50vh;
    margin: 0 auto;
    
} 
div {
  width: 100px;
  height: 100px;
  background-color: rgb(79, 57, 133);
  position: relative;
  animation-name: example;
  animation-duration: 5s;
  animation-timing-function: linear;
  animation-delay: 2s;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}

@keyframes example {
  0%   {background-color:rgb(72, 64, 141); left:0px; top:0px;}
  25%  {background-color:rgb(255, 255, 184); left:200px; top:0px;}
  50%  {background-color:rgb(49, 49, 76); left:200px; top:200px;}
  75%  {background-color:rgb(125, 154, 125); left:0px; top:200px;}
  100% {background-color:rgb(113, 60, 60); left:0px; top:0px;}
}

</style>
</head>
<body>

<h1>CSS Animation</h1>

<p>This example uses six of the animation properties:</p>

<main>
    <div></div>
    </main>

</body>
</html>
