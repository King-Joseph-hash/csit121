<!DOCTYPE html>
<html>

<head>
    <title>Function Reuse Examples</title>
    <style>
        body {
            font-family: Tahoma, Geneva, Verdana, sans-serif;
            background-color: beige;
        }

        h1 {
            text-align: center;
            background-color: rgb(255, 255, 255);
            margin: 0 auto;
            padding: 10px;
            box-shadow: 2px 2px 3px #bbbaba;
            width: 75%;
        }

        div {
            margin: 40px;
        }

        button {
            border-radius: 10px;
            padding: 8px;
            background-color: rgb(222, 182, 255);
            border: none;
        }

        input[type=submit] {
            border-radius: 10px;
            padding: 4px;
            background-color: rgb(222, 182, 255);
            border: none;
        }
        a {
            color:rgb(95, 38, 141)
        }

        a:hover {
            color:#000000
        }
    </style>
    <script>
        // Defining the function once
        function showAlert() {
            alert("Please click OK to continue.");
        }
    </script>
</head>

<body>
    <h1>Javascript Function Reuse Examples</h1>
    <!-- Page load event -->
    <script>
        // Call when the window loads
        window.onload = function () {

            showAlert();
        }
    </script>

    <!-- Button click -->
    <h2>Button Click</h2>
    <div><button onclick="showAlert()">Show Alert</button></div>

    <!-- Link click -->
    <h2>Link Click</h2>
    <div><a href="#" onclick="showAlert(); return false;">Click for Alert</a></div>


    <!-- Form submission -->
    <h2>Form Submission</h2>
    <div>
        <form onsubmit="showAlert(); return false;">
            <input type="text" value="Enter something">
            <input type="submit" value="Submit Form">
        </form>
    </div>



    <!-- Timed execution -->
    <h2>Timed Execution</h2>
    <div><button onclick="setTimeout(showAlert, 2000)">Show Alert After 2 Seconds</button></div>

    <!-- Combination with another function -->
    <script>
        function confirmAndAlert() {
            if (confirm("Are you sure?")) {
                showAlert();
            }
        }
    </script>
    <h2>Combined with another Function</h2>
    <div><button onclick="confirmAndAlert()">Confirm Then Alert</button></div>
</body>

</html>
