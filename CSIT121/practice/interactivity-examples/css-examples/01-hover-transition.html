<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example: Hover Transition</title>
  <style>

    body { font-family: Arial, Helvetica, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.5; color: #1f1f1f; }
    h1 { color: #0a4054; }
    code { background: #eee; padding: 2px 5px; }

    .btn {
      display: inline-block;
      background: #0a4054;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s ease, transform 0.3s ease;   /* the transition goes HERE, not on :hover */
    }

    .btn:hover,
    .btn:focus {
      background: #f2494c;
      transform: scale(1.1);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    /* ===== END CSS ===== */
  </style>
</head>
<body>
  <h1>Example: Hover Transition</h1>
  <p>Hover over (or tab to) the button. Then try deleting the <code>transition</code> line and compare.</p>


  <a class="btn" href="#">Hover me</a>

</body>
</html>
