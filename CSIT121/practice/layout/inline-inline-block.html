<!DOCTYPE html>
<html>

<head>
    <title>Layout Practice</title>
    <style>
        div {
            background-color: lightgray;
            border: 2px solid black;
            margin: 10px;
            padding: 10px;
        }

        #box1 {
            background: peachpuff;
            padding: 20px;
            margin: 30px;
        }

        #box2 {
            background: lightblue;
            padding: 10px;
            margin: 5px;
        }

        #box3 {
            background: lightgreen;
            padding: 40px;
            margin: 0;
        }
        
#box1 { display: inline; }
#box2 { display: inline-block; width: 200px; }

#img-kid {
    margin-top: 10px;
}

    </style>
</head>

<body>

    <h1>Layout Practice Page</h1>

    <div id="box1">Box 1</div>
    <div id="box2">Box 2</div>
    <div id="box3">Box 3</div>

    <img src="../AdobeStock_608514790.jpeg" height="300" id="img-kid">

</body>

</html>
