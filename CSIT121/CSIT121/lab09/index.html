<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reads the XML data using JavaScript</title>

    <!-- CSS -->
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #7ce2af;
        }

        th {
            background-color: #7c0f65;
            color: white;
        }

        .button {
            position: relative;
            text-align: center;
            padding: 20px;
            border: 4px solid rgb(55, 12, 211);
            background: rgba(20, 192, 4, 0.5);
            color: rgb(230, 36, 78);
            outline: none;
            border-radius: 30px;
            font-size: 30px;
            width: 500px;
        }

        .button:hover {
            color: black;
            background: white;
        }
    </style>

    <!-- JavaScript -->
    <script>
        let tableVisible = false;

        function toggleEmployeeDetails() {

            // If the table is currently visible, hide it
            if (tableVisible) {
                document.getElementById("employeeTable").innerHTML = "";
                document.getElementById("employeeTable").style.display = "none";

                document.getElementById("toggleButton").innerHTML =
                    "Get Employees Details";

                tableVisible = false;
            }

            // If the table is currently hidden, load and display it
            else {
                loadXMLDoc();
            }
        }

        function loadXMLDoc() {
            let xmlhttp = new XMLHttpRequest();

            xmlhttp.onreadystatechange = function () {

                // Request finished and response is ready
                // and Status is "OK"
                if (this.readyState == 4 && this.status == 200) {
                    empDetails(this);

                    document.getElementById("employeeTable").style.display = "table";

                    document.getElementById("toggleButton").innerHTML =
                        "Close Employees Details";

                    tableVisible = true;
                }
            };

            // employee.xml is the external XML file
            xmlhttp.open("GET", "employee.xml", true);
            xmlhttp.send();
        }

        function empDetails(xml) {
            let i;
            let xmlDoc = xml.responseXML;

            let table =
                `<tr><th>Firstname</th><th>Lastname</th>
                    <th>Title</th><th>Division</th>
                    <th>Building</th><th>Room</th>
                </tr>`;

            let x = xmlDoc.getElementsByTagName("employee");

            // Start to fetch the data by using TagName
            for (i = 0; i < x.length; i++) {
                table += "<tr><td>" +
                    x[i].getElementsByTagName("firstname")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("lastname")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("title")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("division")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("building")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("room")[0]
                        .childNodes[0].nodeValue + "</td></tr>";
            }

            // Print the XML data in table form
            document.getElementById("employeeTable").innerHTML = table;
        }
    </script>
</head>

<body>

    <div style="text-align: center;">
        <button type="button" class="button"
            id="toggleButton"
            onclick="toggleEmployeeDetails()">
            Get Employees Details
        </button>
    </div>

    <br><br>

    <table id="employeeTable" style="display: none;"></table>

</body>
</html>
