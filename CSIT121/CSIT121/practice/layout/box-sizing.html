<!-- From W3Schools: https://www.w3schools.com/css/css3_box-sizing.asp -->
 
<!DOCTYPE html>
<html>
<head>
<style> 
* {box-sizing: content-box; }

body {
  font-family: sans-serif;
}
.div1 {
  width: 300px;
  height: 100px;
  border: 2px solid blue;
}

.div2 {
  width: 300px;
  height: 100px;  
  padding: 50px;
  border: 10px solid red;
}
.div3 {
  width: 300px;
  height: 100px;
  border: 2px solid blue;
  box-sizing: border-box;
}

.div4 {
  width: 300px;
  height: 100px;  
  padding: 50px;
  border: 10px solid red;
  box-sizing: border-box;
}
</style>
</head>
<body>

<h1>Without box-sizing</h1>

<div class="div1">This div is smaller (width is 300px and height is 100px).</div>
<br>
<div class="div2"> This dix is also 300px and height is 100px</div>

<h1>With box-sizing</h1>

<div class="div3">Both divs are the same size now!</div>
<br>
<div class="div4"></div>


</body>
</html>
