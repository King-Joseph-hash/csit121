<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <ul>
      <li><a href="tierlist.html">Tier List</a></li>
      <li><a href="contact.html">Contact Form</a></li>
    </ul>
  </nav>

  <main>
    <h1>Contact Form</h1>
    <p>Tell me what you think about my Premier League tier list.</p>

    <form id="contactForm">

      <div class="field">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="club">Favorite Premier League Club:</label>
        <select id="club" name="club">
          <option value="">Choose a club</option>
          <option value="Arsenal">Arsenal</option>
          <option value="Aston Villa">Aston Villa</option>
          <option value="Chelsea">Chelsea</option>
          <option value="Liverpool">Liverpool</option>
          <option value="Manchester City">Manchester City</option>
          <option value="Manchester United">Manchester United</option>
          <option value="Newcastle United">Newcastle United</option>
          <option value="Tottenham">Tottenham</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <fieldset>
        <legend>Do you agree with my S tier?</legend>
        <input type="radio" id="agreeYes" name="agree" value="Yes">
        <label for="agreeYes">Yes</label>
        <input type="radio" id="agreeSome" name="agree" value="Somewhat">
        <label for="agreeSome">Somewhat</label>
        <input type="radio" id="agreeNo" name="agree" value="No">
        <label for="agreeNo">No</label>
      </fieldset>

      <div class="field">
        <input type="checkbox" id="stadium" name="stadium" value="Yes">
        <label for="stadium">I have been to a Premier League match</label>
      </div>

      <div class="field">
        <input type="checkbox" id="newsletter" name="newsletter" value="Yes">
        <label for="newsletter">Join the newsletter</label>
      </div>

      <div class="field">
        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="5"></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function (event) {
      event.preventDefault();

      var name = document.getElementById("name").value;
      var email = document.getElementById("email").value;
      var club = document.getElementById("club").value;
      var agreeChoice = document.querySelector('input[name="agree"]:checked');
      var agree = agreeChoice ? agreeChoice.value : "";
      var stadium = document.getElementById("stadium").checked ? "yes" : "no";
      var newsletter = document.getElementById("newsletter").checked ? "yes" : "no";
      var comments = document.getElementById("comments").value;

      var text =
        "Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Favorite Club: " + club + "\n" +
        "Agree With S Tier: " + agree + "\n" +
        "Been To A Match: " + stadium + "\n" +
        "Join Newsletter: " + newsletter + "\n" +
        "Comments: " + comments;

      var file = new Blob([text], { type: "text/plain" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = "form-data-from-" + name + ".txt";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    });
  </script>

</body>
</html>
